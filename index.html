<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>ECO-MONITOR | 废土档案版</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    body{
      margin:0; overflow:hidden;
      background-color:#e6d8c3;
      cursor:none;
      font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body.intro-mode{ cursor:auto !important; }

    /* =========================
       开场视频层
    ========================= */
    #intro-layer{
      position:fixed;
      inset:0;
      z-index:999999;
      background:#000;
      pointer-events:all;
      opacity:1;
    }
    #intro-video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:1;
      background:#000;
      filter: none;
    }

    /* =========================
       电影海报字卡（红字、无阴影）
       参考你给的 L'INTRÚS 排版：
       - 顶部：小一号导演/作者行
       - 中间：巨大标题
       - 下方：密集 credits 段落
    ========================= */

      position:absolute;
      inset:0;
      z-index:22;
      pointer-events:none;
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0; /* 动画控制 */
    }
    .poster-wrap{
      width:min(1200px, 92vw);
      color: rgba(255,0,0,0.98);
      text-transform:uppercase;
      text-shadow:none;
      text-align:center;
    }
    .poster-top{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight:900;
      letter-spacing:0.14em;
      font-size: clamp(12px, 1.6vw, 18px);
      opacity:0.98;
      margin-bottom: 10px;
    }
    .poster-main{
      font-weight: 1000;
      letter-spacing: 0.01em;
      font-size: clamp(60px, 10.8vw, 170px);
      line-height: 0.92;
      margin:0;
    }
    .poster-credits{
      margin-top: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight: 800;
      letter-spacing: 0.12em;
      font-size: clamp(10px, 1.1vw, 14px);
      line-height: 1.55;
      opacity: 0.92;

       逐句英文叠字（海报后出现）
       - 全红色
       - 无阴影
       - 顶部居中
    ========================= */

      left:0;

      display:flex;
      justify-content:center;
      pointer-events:none;
      z-index:24;

    #intro-text .wrap{
      width:min(1200px, 92vw);
      text-align:center;
      color: rgba(255,0,0,0.96);
      text-shadow:none;
      text-transform:uppercase;
      letter-spacing:0.08em;
    }
    #intro-text .line{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight: 900;
      font-size: clamp(24px, 3.2vw, 52px);
      line-height: 1.05;

    .stat-box{

      font-size:12px; font-weight:600; letter-spacing:1px;
      min-width:200px;
    }
    .stat-box span{ color:#fff; margin-left:10px; }

    .right-panel{
      position:absolute; right:5%; bottom:8%; top:15%;
      width:450px;
      background-color:rgba(30,30,30,0.95);
      color:#ddd;
      padding:0;
      border-left:6px solid #cc3333;
      pointer-events:auto;
      backdrop-filter:blur(10px);

      box-shadow:0 20px 50px rgba(0,0,0,0.3);

    .video-box{

      background:#000;
      border-bottom:1px solid #555;

    #ui-video{ width:100%; height:100%; object-fit:cover; opacity:0.95; }
    .rec-tag{
      position:absolute; top:15px; left:15px;

      animation:blink 1s infinite; z-index:10; letter-spacing:1px;
    }
    @keyframes blink{ 50%{ opacity:0; } }

    .scroll-container{ flex-grow:1; overflow-y:auto; padding:30px; padding-bottom:50px; }
    .scroll-container::-webkit-scrollbar{ width:6px; }
    .scroll-container::-webkit-scrollbar-track{ background:#222; }
    .scroll-container::-webkit-scrollbar-thumb{ background:#cc3333; border-radius:3px; }

    .desc-text{
      font-size:14px; line-height:1.8; margin-bottom:25px;
      color:#eee; text-align:justify;
      border-bottom:1px solid #555; padding-bottom:25px;

    .detail-list{ font-size:13px; color:#aaa; line-height:1.7; }
    .detail-item{ margin-bottom:15px; }
    .detail-label{

    .close-btn{

      border:2px solid #333; border-radius:50%;
      display:flex; justify-content:center; align-items:center;

      color:#886644; font-size:12px;

    }

    body.active-mode{ cursor:auto !important; }
    #ui-layer:hover, .close-btn:hover{ cursor:default; }
  </style>
</head>

  <script type="x-shader/x-vertex" id="vertexShader">
    uniform vec3 uMouse;
    attribute float size;
    attribute vec3 customColor;
    varying vec3 vColor;
    void main() {
      vColor = customColor;
      vec3 pos = position;
      float dist = distance(pos.xz, uMouse.xz);
      float radius = 7.0;
      if (dist < radius) {
        vec3 dir = normalize(pos - uMouse);
        float force = (radius - dist) / radius;
        pos.x += dir.x * force * 3.0;
        pos.z += dir.z * force * 3.0;
      }
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = size * (200.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  </script>

  <script type="x-shader/x-fragment" id="fragmentShader">
    varying vec3 vColor;
    void main() {
      float dist = length(gl_PointCoord - vec2(0.5));
      float alpha = 1.0 - smoothstep(0.4, 0.5, dist);
      if (alpha < 0.01) discard;
      gl_FragColor = vec4(vColor, alpha);
    }
  </script>

  <script type="module">

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    /* =========================

    ========================= */
    const POSTER_TOP_LINE   = "DIRECTED BY // ECO-MONITOR UNIT";

    /* =========================

    ========================= */
    const INTRO_LINES = [

    ];

    const LINE_GAP      = 0.12;

    /* 海报显示时长（秒） */
    const POSTER_IN   = 0.18;
    const POSTER_HOLD = 2.10;
    const POSTER_OUT  = 0.40;

    /* 视频结束前多少秒停止出字，避免与最终淡出冲突 */
    const TEXT_END_OFFSET = 1.15;

    /* --- 动物数据（这里放你的完整版也行） --- */
    const animalData = {
      "POLYMER TURTLE": { video:"./wugui.mp4", name:"聚合体海龟", latin:"CHELONIA PLASTICUS", pollutant:"不可降解聚苯乙烯 (PS)", tox:"85%", desc:"...", look:"...", act:"..." },
      "PLASTIC CRAB": { video:"./xie.mp4", name:"工业寄居蟹", latin:"PAGURUS INDUSTRIALIS", pollutant:"聚氯乙烯 (PVC) / 塑化剂", tox:"45%", desc:"...", look:"...", act:"..." },
      "OIL BIRD": { video:"./niao.mp4", name:"油污鸬鹚", latin:"PHALACROCORAX OLEUM", pollutant:"重质原油 / 多环芳烃", tox:"92%", desc:"...", look:"...", act:"..." },
      "FIBER JELLY": { video:"./shuimu.mp4", name:"光纤水母", latin:"MEDUSA FIBEROPTICUS", pollutant:"电磁辐射 / 铜离子泄漏", tox:"60%", desc:"...", look:"...", act:"..." },
      "SONAR DOLPHIN": { video:"./haitun.mp4", name:"声呐海豚", latin:"DELPHINUS SONARIS", pollutant:"高频声波污染", tox:"30%", desc:"...", look:"...", act:"..." },
      "TOXIC SNAKE": { video:"./she.mp4", name:"荧光环蛇", latin:"BUNGARUS RADIUM", pollutant:"强酸 / 放射性同位素", tox:"99%", desc:"...", look:"...", act:"..." },
      "ACID FROG": { video:"./wa.mp4", name:"酸蚀箭毒蛙", latin:"DENDROBATES ACIDUS", pollutant:"硫酸/硝酸 (pH<3)", tox:"75%", desc:"...", look:"...", act:"..." },
      "RADIOACTIVE FISH": { video:"./yu.mp4", name:"核辐射鱼", latin:"PISCES NUCLEARIS", pollutant:"铯-137 / 锶-90", tox:"100%", desc:"...", look:"...", act:"..." },
      "GHOST SEAL": { video:"./haibao.mp4", name:"幽灵网缚海豹", latin:"PHOCA LAQUEUS", pollutant:"聚酰胺纤维", tox:"50%", desc:"...", look:"...", act:"..." }
    };

    /* --- Three.js 场景 --- */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe6d8c3);
    scene.fog = new THREE.FogExp2(0xe6d8c3, 0.012);

    const ambientLight = new THREE.AmbientLight(0xffeedd, 3.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffaa77, 3.0);
    dirLight.position.set(50,80,50);
    scene.add(dirLight);

    const cameraLight = new THREE.DirectionalLight(0xffffff, 1.5);
    scene.add(cameraLight);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 160, 260); // 开场更远

    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);
    const canvas = renderer.domElement;
    canvas.classList.add('visible');

    /* 光标（仍保持原逻辑） */
    const cursorGroup = new THREE.Group();
    scene.add(cursorGroup);
    const hexGeometry = new THREE.RingGeometry(3.5, 4.2, 6);
    const hexMaterial = new THREE.MeshBasicMaterial({ color:0x444444, side:THREE.DoubleSide, transparent:true, opacity:0.8 });
    const cursorHex = new THREE.Mesh(hexGeometry, hexMaterial);
    cursorHex.rotation.x = -Math.PI/2;
    cursorGroup.add(cursorHex);
    const triGeo = new THREE.ConeGeometry(0.8, 2, 3);
    const triMat = new THREE.MeshBasicMaterial({ color:0x222222 });
    const cursorTri = new THREE.Mesh(triGeo, triMat);
    cursorTri.rotation.x = Math.PI;
    cursorTri.position.y = 6;
    cursorGroup.add(cursorTri);

    /* 无人机 */
    const droneGroup = new THREE.Group();
    scene.add(droneGroup);
    droneGroup.visible = false;
    const camBody = new THREE.Mesh(new THREE.BoxGeometry(1.5,1,2), new THREE.MeshBasicMaterial({ color:0x222222 }));
    droneGroup.add(camBody);
    const camLens = new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.8,16), new THREE.MeshBasicMaterial({ color:0x666666 }));
    camLens.rotation.x = Math.PI/2; camLens.position.z = 1.2;
    droneGroup.add(camLens);
    const recLight = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshBasicMaterial({ color:0xff0000 }));
    recLight.position.set(0.6,0.6,1.0);
    droneGroup.add(recLight);

    /* 射线与地形 */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const mouseWorld = new THREE.Vector3();
    const hitPlane = new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshBasicMaterial({ visible:false }));
    hitPlane.rotation.x = -Math.PI/2;
    scene.add(hitPlane);

    const geometry = new THREE.BufferGeometry();
    const positions = [], colors = [], sizes = [];
    const colWater = new THREE.Color("#668899");
    const colLand1 = new THREE.Color("#ccaa66");
    const colLand2 = new THREE.Color("#885533");
    const colCanopy = new THREE.Color("#444433");
    const range = 180;
    const gap = 2.5;
    function getElevation(x,z){ return Math.sin(x*0.05)*8 + Math.cos(z*0.05)*8; }

    for(let x=-range; x<range; x+=gap){
      for(let z=-range; z<range; z+=gap){
        const distToCenter = Math.sqrt(x*x+z*z);
        const maxRadius = 120 + Math.sin(Math.atan2(z,x)*5.0)*15.0 + Math.cos(x*0.1)*10.0;
        if(distToCenter>maxRadius) continue;

        let y=getElevation(x,z);
        let pSize=0, pColor=new THREE.Color(), keep=false;

        if(y<-3){
          if(Math.random()>0.4){ pSize=4.0; pColor=colWater; keep=true; }
        }else{
          if(Math.random()>0.5){
            keep=true;
            const r=Math.random();
            if(r>0.96){ pSize=7.0; pColor=colCanopy; y+=3.0; }
            else if(r>0.6){ pSize=2.5; pColor=colLand2; }
            else { pSize=1.5; pColor=colLand1; }
          }
        }
        if(keep){ positions.push(x,y,z); colors.push(pColor.r,pColor.g,pColor.b); sizes.push(pSize); }
      }
    }
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors,3));
    geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes,1));

    const shaderMaterial = new THREE.ShaderMaterial({
      uniforms:{ uMouse:{ value:new THREE.Vector3(0,0,0) } },
      vertexShader: document.getElementById('vertexShader').textContent,
      fragmentShader: document.getElementById('fragmentShader').textContent,
      transparent:true, depthTest:true, depthWrite:false
    });
    const terrain = new THREE.Points(geometry, shaderMaterial);
    scene.add(terrain);

    /* 物种群（保持你的结构） */
    const loader = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    loader.setDRACOLoader(dracoLoader);

    class SpeciesSwarm{
      constructor(name, normalFile, mutantFile, centerPos){
        this.name=name;
        this.center=centerPos.clone();
        this.group=new THREE.Group();
        scene.add(this.group);
        this.group.userData={ isSwarm:true, swarmName:name };

        this.boids=[];
        this.state='swarm';
        this.modelGroup=new THREE.Group();
        this.turntable=new THREE.Group();
        this.group.add(this.modelGroup);
        this.modelGroup.add(this.turntable);
        this.modelGroup.visible=false;

        const count=10;
        const boidGeo=new THREE.ConeGeometry(0.8,2,4);
        for(let i=0;i<count;i++){
          const isMutant=Math.random()>0.8;
          const color=isMutant?0xcc3333:(Math.random()>0.5?0x666666:0x333333);
          const mat=new THREE.MeshBasicMaterial({ color, wireframe:true });
          const mesh=new THREE.Mesh(boidGeo, mat);
          const offset=new THREE.Vector3((Math.random()-0.5)*20,(Math.random()-0.5)*10,(Math.random()-0.5)*20);
          mesh.position.copy(this.center).add(offset);
          mesh.userData={ offset, phase:Math.random()*Math.PI };
          scene.add(mesh);
          this.boids.push(mesh);
        }

        loader.load(normalFile,(gltf)=>{
          this.normalMesh=gltf.scene;
          this.normalMesh.scale.set(5,5,5);
          this.turntable.add(this.normalMesh);
          if(gltf.animations.length>0){
            this.nmMixer=new THREE.AnimationMixer(this.normalMesh);
            this.nmMixer.clipAction(gltf.animations[0]).play();
          }
        });

        loader.load(mutantFile,(gltf)=>{
          this.mutantMesh=gltf.scene;
          this.mutantMesh.scale.set(0.1,0.1,0.1);
          this.mutantMesh.visible=false;
          this.turntable.add(this.mutantMesh);
          if(gltf.animations.length>0){
            this.mmMixer=new THREE.AnimationMixer(this.mutantMesh);
            this.mmMixer.clipAction(gltf.animations[0]).play();
          }
        });
      }

      update(delta){
        const time=Date.now()*0.001;
        this.boids.forEach((boid,i)=>{
          if(this.state==='focused'){
            boid.visible=false;
          }else{
            boid.visible=true;
            boid.position.x=this.center.x + boid.userData.offset.x + Math.sin(time+boid.userData.phase)*5;
            boid.position.z=this.center.z + boid.userData.offset.z + Math.cos(time+boid.userData.phase*0.5)*5;
            const y=getElevation(boid.position.x, boid.position.z);
            boid.position.y=y+5+Math.sin(time*2+i)*2;
            boid.rotation.y += 0.02;
          }
        });

        const centerY=getElevation(this.center.x,this.center.z);
        this.modelGroup.position.set(this.center.x, centerY+5, this.center.z);

        if(this.state==='focused'){
          this.turntable.rotation.y -= 0.015;
          this.modelGroup.position.y = centerY + 12 + Math.sin(time*1.5)*1.5;
        }else{
          this.turntable.rotation.y = 0;
        }

        if(this.nmMixer) this.nmMixer.update(delta);
        if(this.mmMixer) this.mmMixer.update(delta);
      }

      hover(isHovering){
        if(this.state==='focused') return;
        if(isHovering && this.state!=='hover'){
          this.state='hover';
          this.modelGroup.visible=true;
          this.turntable.scale.set(1,1,1);
          gsap.to(this.turntable.scale,{x:1,y:1,z:1,duration:0.5});
          this.boids.forEach(b=>gsap.to(b.scale,{x:0,y:0,z:0,duration:0.3}));
        }else if(!isHovering && this.state==='hover'){
          this.state='swarm';
          this.modelGroup.visible=false;
          this.boids.forEach(b=>gsap.to(b.scale,{x:1,y:1,z:1,duration:0.5,delay:0.2}));
        }
      }

      focus(){
        if(this.state==='focused') return;
        this.state='focused';
        this.modelGroup.visible=true;
        const tl=gsap.timeline();
        if(this.normalMesh){
          tl.to(this.normalMesh.position,{x:0.5,duration:0.05,yoyo:true,repeat:5})
            .to(this.normalMesh.scale,{x:0.1,y:0.1,z:0.1,duration:0.2});
        }
        tl.add(()=>{
          if(this.normalMesh) this.normalMesh.visible=false;
          if(this.mutantMesh) this.mutantMesh.visible=true;
        });
        if(this.mutantMesh){
          tl.fromTo(this.mutantMesh.scale,{x:0.1,y:0.1,z:0.1},{x:30,y:30,z:30,duration:0.8,ease:"back.out(1.2)"});
        }
      }

      unfocus(){
        if(this.state!=='focused') return;
        this.state='swarm';
        const tl=gsap.timeline();
        if(this.mutantMesh) tl.to(this.mutantMesh.scale,{x:0.1,y:0.1,z:0.1,duration:0.3});
        tl.add(()=>{
          if(this.mutantMesh) this.mutantMesh.visible=false;
          if(this.normalMesh){
            this.normalMesh.visible=true;
            this.normalMesh.scale.set(5,5,5);
          }
          this.modelGroup.visible=false;
        });
        this.boids.forEach(b=>{
          b.visible=true;
          gsap.to(b.scale,{x:1,y:1,z:1,duration:0.5});
        });
      }
    }

    const swarms = [
      new SpeciesSwarm("POLYMER TURTLE","./wugui.glb","./bwugui.glb",new THREE.Vector3(0,0,0)),
      new SpeciesSwarm("PLASTIC CRAB","./xie.glb","./bxie.glb",new THREE.Vector3(30,0,30)),
      new SpeciesSwarm("OIL BIRD","./niao.glb","./bniao.glb",new THREE.Vector3(-40,0,-40)),
      new SpeciesSwarm("FIBER JELLY","./shuimu.glb","./bshuimu.glb",new THREE.Vector3(0,0,-60)),
      new SpeciesSwarm("SONAR DOLPHIN","./haitun.glb","./bhaitun.glb",new THREE.Vector3(-50,0,20)),
      new SpeciesSwarm("TOXIC SNAKE","./she.glb","./bshe.glb",new THREE.Vector3(50,0,50)),
      new SpeciesSwarm("ACID FROG","./wa.glb","./bwa.glb",new THREE.Vector3(-60,0,0)),
      new SpeciesSwarm("RADIOACTIVE FISH","./yu.glb","./byu.glb",new THREE.Vector3(60,0,-20)),
      new SpeciesSwarm("GHOST SEAL","./bao.glb","./bhaibao.glb",new THREE.Vector3(20,0,-80))
    ];

    const clock = new THREE.Clock();
    const uiLayer = document.getElementById('ui-layer');
    const uiVideo = document.getElementById('ui-video');
    let focusedSwarm = null;

    window.closePanel = function(){
      if(focusedSwarm){
        focusedSwarm.unfocus();
        focusedSwarm = null;
        uiVideo.pause(); uiVideo.currentTime = 0;
        gsap.to(camera.position,{x:0,y:60,z:80,duration:1.5,ease:"power2.inOut"});
        gsap.to(controls.target,{x:0,y:0,z:0,duration:1.5});
        uiLayer.classList.remove('active');
        document.getElementById('ui-header').style.opacity = 1;
        document.body.classList.remove('active-mode');
        droneGroup.visible = false;
      }
    };

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.5;
    controls.maxPolarAngle = Math.PI/2 - 0.1;
    controls.enabled = false;

    document.addEventListener('mousemove',(e)=>{
      if(!controls.enabled) return;
      if(!focusedSwarm){
        mouse.x = (e.clientX/window.innerWidth)*2 - 1;
        mouse.y = -(e.clientY/window.innerHeight)*2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObject(hitPlane);
        if(hits.length>0){
          mouseWorld.copy(hits[0].point);
          shaderMaterial.uniforms.uMouse.value.copy(hits[0].point);
        }
      }
    });

    document.addEventListener('click',(e)=>{
      if(!controls.enabled) return;
      if(e.target.closest('.close-btn') || e.target.closest('.right-panel') || e.target.closest('.left-panel')) return;

      let clickedSwarm=null;
      mouse.x = (e.clientX/window.innerWidth)*2 - 1;
      mouse.y = -(e.clientY/window.innerHeight)*2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(scene.children,true);
      for(const hit of intersects){
        let obj=hit.object;
        while(obj){
          if(obj.userData && obj.userData.isSwarm){
            clickedSwarm = swarms.find(s=>s.name===obj.userData.swarmName);
            break;
          }
          obj=obj.parent;
        }
        if(clickedSwarm) break;
      }
      if(!clickedSwarm){
        swarms.forEach(s=>{
          const dist = new THREE.Vector2(s.center.x,s.center.z).distanceTo(new THREE.Vector2(mouseWorld.x,mouseWorld.z));
          if(dist<15) clickedSwarm=s;
        });
      }

      if(clickedSwarm){
        if(focusedSwarm!==clickedSwarm){
          if(focusedSwarm) focusedSwarm.unfocus();
          focusedSwarm=clickedSwarm;
          focusedSwarm.focus();

          const targetPos=focusedSwarm.modelGroup.position;
          gsap.to(camera.position,{x:targetPos.x+50,y:targetPos.y+30,z:targetPos.z+80,duration:1.5,ease:"power2.inOut"});
          gsap.to(controls.target,{x:targetPos.x,y:targetPos.y,z:targetPos.z,duration:1.5});

          const data = animalData[focusedSwarm.name] || {};
          const setText=(id,t)=>{ const el=document.getElementById(id); if(el) el.innerText=t; };
          setText('ui-name', data.name || focusedSwarm.name);
          setText('ui-latin', data.latin || "Unknown");
          setText('ui-pollutant', data.pollutant || "UNKNOWN");
          setText('ui-tox', data.tox || "0%");
          setText('ui-desc', data.desc || "...");
          setText('ui-look', data.look || "...");
          setText('ui-act', data.act || "...");

          if(data.video){
            uiVideo.src=data.video;
            uiVideo.load();
            uiVideo.oncanplay=()=>{ uiVideo.play().catch(()=>{}); };
          }

          uiLayer.classList.add('active');
          document.getElementById('ui-header').style.opacity=0;
          document.body.classList.add('active-mode');
          droneGroup.visible=true;
        }
      }else{
        if(focusedSwarm) window.closePanel();
      }
    });

    function animate(){
      requestAnimationFrame(animate);
      const delta=clock.getDelta();
      const t=Date.now()*0.001;
      cameraLight.position.copy(camera.position);

      if(focusedSwarm){
        cursorGroup.scale.set(0,0,0);
        const target=focusedSwarm.modelGroup.position;
        droneGroup.position.x = target.x + Math.sin(t)*35;
        droneGroup.position.z = target.z + Math.cos(t)*35;
        droneGroup.position.y = target.y + 25 + Math.sin(t*2)*2;
        droneGroup.lookAt(target);
        recLight.material.color.setHex((Date.now()%1000<500)?0xff0000:0x330000);
      }else{
        cursorGroup.scale.lerp(new THREE.Vector3(1,1,1),0.1);
        let hover=null;
        swarms.forEach(s=>{
          const dist=new THREE.Vector2(s.center.x,s.center.z).distanceTo(new THREE.Vector2(mouseWorld.x,mouseWorld.z));
          if(dist<20) hover=s;
          s.hover(dist<20);
        });
        if(hover){
          hexMaterial.color.set(0xff4444);
          cursorGroup.scale.lerp(new THREE.Vector3(1.5,1.5,1.5),0.1);
        }else{
          hexMaterial.color.set(0x444444);
        }

        const targetY=getElevation(mouseWorld.x,mouseWorld.z);
        cursorGroup.position.x += (mouseWorld.x - cursorGroup.position.x)*0.2;
        cursorGroup.position.z += (mouseWorld.z - cursorGroup.position.z)*0.2;
        cursorGroup.position.y += (targetY - cursorGroup.position.y)*0.2;
        cursorHex.rotation.z += 0.01;
      }

      swarms.forEach(s=>s.update(delta));
      controls.update();
      renderer.render(scene,camera);
    }

    setTimeout(()=>{ document.getElementById('loading').style.opacity=0; },2000);
    animate();

    window.addEventListener('resize',()=>{
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });

    /* =========================
       开场逻辑：海报 -> 逐句 -> 最后1秒淡出 -> 镜头拉近
    ========================= */
    const introLayer = document.getElementById('intro-layer');
    const introVideo = document.getElementById('intro-video');
    const fallback   = document.getElementById('autoplay-fallback');
    const fallbackBtn= document.getElementById('fallback-btn');

    const posterCard = document.getElementById('poster-card');
    const posterTop  = document.getElementById('poster-top');
    const posterMain = document.getElementById('poster-main');
    const posterCred = document.getElementById('poster-credits');

    const introText  = document.getElementById('intro-text');
    const introLine  = document.getElementById('intro-line');

    posterTop.textContent  = POSTER_TOP_LINE;
    posterMain.textContent = POSTER_MAIN_TITLE;
    posterCred.textContent = POSTER_CREDITS_LINES;

    async function ensurePlay(){
      try{
        introVideo.currentTime = 0;
        await introVideo.play();
      }catch(e){
        fallback.style.display="flex";
      }
    }
    ensurePlay();

    fallbackBtn.addEventListener('click', async ()=>{
      fallback.style.display="none";
      try{
        introVideo.currentTime = 0;
        await introVideo.play();
      }catch(e){
        fallback.style.display="flex";
      }
    });

    function playPosterThenLines(){
      // 海报：淡入 -> 停留 -> 淡出
      const tl = gsap.timeline();
      tl.to(posterCard, { opacity:1, duration:POSTER_IN, ease:"none" }, 0.25)
        .to(posterCard, { opacity:1, duration:POSTER_HOLD, ease:"none" })
        .to(posterCard, { opacity:0, duration:POSTER_OUT, ease:"power2.inOut" })
        .add(()=>{ gsap.to(introText,{opacity:1,duration:0.18,ease:"none"}); }, "+=0.05");
    }

    function startLineSequence(){
      const total = INTRO_LINES.length;
      if(total === 0) return;

      const usable = Math.max(0.1, (introVideo.duration || 8) - TEXT_END_OFFSET);
      const per = usable / total;

      let i = 0;
      const playOne = ()=>{
        if(i >= total) return;

        introLine.textContent = INTRO_LINES[i];
        gsap.killTweensOf(introLine);

        gsap.fromTo(introLine,
          { opacity:0, y:10 },
          {
            opacity:1, y:0, duration:LINE_FADE_IN, ease:"power2.out",
            onComplete: ()=>{
              gsap.to(introLine,{
                opacity:0, y:-6, duration:LINE_FADE_OUT, ease:"power2.in",
                delay: Math.max(0.1, Math.min(LINE_HOLD, per - LINE_FADE_IN - LINE_FADE_OUT - LINE_GAP)),
                onComplete: ()=>{ i++; setTimeout(playOne, LINE_GAP*1000); }
              });
            }
          }
        );
      };
      playOne();
    }

    // 视频元数据就绪：启动海报 & 逐句
    introVideo.addEventListener('loadedmetadata', ()=>{
      playPosterThenLines();
      // 海报总时长结束后再开始逐句（更符合“先海报后字幕”）
      const posterTotal = 0.25 + POSTER_IN + POSTER_HOLD + POSTER_OUT + 0.05;
      setTimeout(()=>{ startLineSequence(); }, Math.floor(posterTotal*1000));
    });

    // 最后 1 秒：疯狂淡出整个 intro（包括海报/字幕/视频）
    introVideo.addEventListener('timeupdate', ()=>{
      if(!introVideo.duration) return;
      const remain = introVideo.duration - introVideo.currentTime;
      if(remain <= 1.0){
        const k = Math.min(1, Math.max(0, 1 - remain/1.0));
        const op = Math.pow(1 - k, 6);
        introLayer.style.opacity = String(op);
      }
    });

    introVideo.addEventListener('ended', ()=>{
      introLayer.remove();
      document.body.classList.remove('intro-mode');

      // 镜头从远到近
      gsap.to(camera.position, { x:0, y:60, z:80, duration:2.6, ease:"power3.inOut" });
      gsap.to(controls.target, {
        x:0, y:0, z:0,
        duration:2.6, ease:"power3.inOut",
        onComplete: ()=>{
          controls.enabled = true;
          controls.autoRotate = true;
        }
      });
    });
  </script>
</body>
</html>
