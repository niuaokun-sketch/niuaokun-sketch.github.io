<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>ECO-MONITOR | 终极监视版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <style>
        /* --- 基础 UI --- */
        body { margin: 0; overflow: hidden; background-color: #ffffff; cursor: none; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        
        /* 资料面板 (居中 + 关闭按钮) */
        #data-panel { 
            position: absolute; 
            left: 50%; top: 50%; 
            transform: translate(-50%, -50%) scale(0.9); /* 初始稍微缩小 */
            width: 340px; padding: 40px; 
            background: rgba(255, 255, 255, 0.9); 
            border: 1px solid #ccc; 
            border-top: 6px solid #333; /* 顶部黑条 */
            color: #333; display: none; 
            backdrop-filter: blur(20px); 
            box-shadow: 0 30px 80px rgba(0,0,0,0.3); 
            z-index: 100; border-radius: 8px;
            text-align: center; /* 内容居中 */
            opacity: 0; /* 配合动画 */
            transition: all 0.3s ease;
        }
        #data-panel.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* 关闭按钮 */
        .close-btn {
            position: absolute; top: 15px; right: 15px;
            width: 30px; height: 30px;
            border: 2px solid #333; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-weight: bold; font-size: 18px;
            transition: all 0.2s; pointer-events: auto;
        }
        .close-btn:hover { background: #333; color: #fff; transform: rotate(90deg); }

        h2 { margin: 10px 0 20px 0; font-size: 28px; letter-spacing: -1px; text-transform: uppercase;}
        .tag { display: inline-block; background: #333; color: #fff; padding: 4px 10px; font-size: 12px; border-radius: 20px; margin-bottom: 20px; font-weight: bold; }
        
        .stat-row { text-align: left; margin-bottom: 15px; }
        .stat-label { font-size: 11px; font-weight: 800; color: #999; letter-spacing: 1px; margin-bottom: 5px; }
        .bar-bg { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; background: #ff4444; width: 0%; border-radius: 5px; transition: width 1s ease-out;}
        
        /* 顶部 UI */
        #ui-header { position: absolute; top: 30px; left: 40px; color: #333; pointer-events: none; z-index: 10; }
        h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
        p { margin: 5px 0 0 0; font-size: 12px; color: #888; font-weight: 600;}
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #333; font-weight: bold; pointer-events: none; transition: opacity 0.5s; background: white; padding: 20px 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div id="ui-header">
        <h1>ECO-MONITOR</h1>
        <p>System Ready // Click to Investigate</p>
    </div>

    <div id="loading">INITIALIZING DRONE CAMERAS...</div>

    <!-- 居中面板 -->
    <div id="data-panel">
        <div class="close-btn" onclick="closePanel()">×</div>
        <span class="tag" id="panel-id">ID: 001</span>
        <h2 id="panel-name">Target</h2>
        
        <div class="stat-row">
            <div class="stat-label">TOXICITY LEVEL</div>
            <div class="bar-bg"><div class="bar-fill" id="bar-tox"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-label">MUTATION RATE</div>
            <div class="bar-bg"><div class="bar-fill" id="bar-adp" style="background: #44cc88;"></div></div>
        </div>
        
        <p style="font-size:13px; line-height:1.6; color:#666; margin-top:25px; text-align: left;" id="panel-desc">...</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Shader -->
    <script type="x-shader/x-vertex" id="vertexShader">
        uniform vec3 uMouse;
        attribute float size;
        attribute vec3 customColor;
        varying vec3 vColor;
        void main() {
            vColor = customColor;
            vec3 pos = position;
            float dist = distance(pos.xz, uMouse.xz);
            float radius = 7.0; 
            if (dist < radius) {
                vec3 dir = normalize(pos - uMouse);
                float force = (radius - dist) / radius;
                pos.x += dir.x * force * 3.0; 
                pos.z += dir.z * force * 3.0;
            }
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = size * (200.0 / -mvPosition.z); 
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentShader">
        varying vec3 vColor;
        void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            float alpha = 1.0 - smoothstep(0.4, 0.5, dist);
            if (alpha < 0.01) discard;
            gl_FragColor = vec4(vColor, alpha); 
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // --- 1. 场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        scene.fog = new THREE.FogExp2(0xffffff, 0.015);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5); 
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(50, 80, 50);
        scene.add(dirLight);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 60, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // --- 2. 3D 光标 (六边形) ---
        const cursorGroup = new THREE.Group();
        scene.add(cursorGroup);
        const hexGeometry = new THREE.RingGeometry(3.5, 4.2, 6); 
        const hexMaterial = new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const cursorHex = new THREE.Mesh(hexGeometry, hexMaterial);
        cursorHex.rotation.x = -Math.PI / 2;
        cursorGroup.add(cursorHex);
        const triGeo = new THREE.ConeGeometry(0.8, 2, 3);
        const triMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const cursorTri = new THREE.Mesh(triGeo, triMat);
        cursorTri.rotation.x = Math.PI; cursorTri.position.y = 6;
        cursorGroup.add(cursorTri);

        // --- 3. 📷 无人机相机 (The Black Camera) ---
        const droneGroup = new THREE.Group();
        scene.add(droneGroup);
        droneGroup.visible = false; // 默认隐藏

        // 机身
        const camBody = new THREE.Mesh(
            new THREE.BoxGeometry(2, 1.5, 3),
            new THREE.MeshBasicMaterial({ color: 0x111111 }) // 纯黑
        );
        droneGroup.add(camBody);
        
        // 镜头
        const camLens = new THREE.Mesh(
            new THREE.CylinderGeometry(0.8, 0.8, 1, 16),
            new THREE.MeshBasicMaterial({ color: 0x333333 })
        );
        camLens.rotation.x = Math.PI / 2;
        camLens.position.z = 1.8;
        droneGroup.add(camLens);

        // 录制红点 (闪烁)
        const recLight = new THREE.Mesh(
            new THREE.SphereGeometry(0.3),
            new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        recLight.position.set(0.8, 0.8, 1.5);
        droneGroup.add(recLight);

        // --- 4. 交互射线 & 地形 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const mouseWorld = new THREE.Vector3(); 
        const hitPlane = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshBasicMaterial({ visible: false }));
        hitPlane.rotation.x = -Math.PI / 2;
        scene.add(hitPlane);

        const geometry = new THREE.BufferGeometry();
        const positions = []; const colors = []; const sizes = [];
        const colWater = new THREE.Color("#99DDFF"); 
        const colLand1 = new THREE.Color("#88CC44"); 
        const colLand2 = new THREE.Color("#66AA33"); 
        const colLand3 = new THREE.Color("#DDEEAA"); 
        const colCanopy = new THREE.Color("#3A6B29");
        const range = 180; const gap = 2.5; 

        function getElevation(x, z) { return Math.sin(x * 0.05) * 8 + Math.cos(z * 0.05) * 8; }

        for (let x = -range; x < range; x += gap) {
            for (let z = -range; z < range; z += gap) {
                const distToCenter = Math.sqrt(x*x + z*z);
                const maxRadius = 120 + Math.sin(Math.atan2(z, x) * 5.0) * 15.0 + Math.cos(x * 0.1) * 10.0;
                if (distToCenter > maxRadius) continue;
                let y = getElevation(x, z);
                let pSize = 0.0; let pColor = new THREE.Color(); let keepPoint = false;
                if (y < -3) {
                    if (Math.random() > 0.4) { pSize = 4.0; pColor = colWater; keepPoint = true; }
                } else {
                    if (Math.random() > 0.5) { 
                        keepPoint = true; const r = Math.random();
                        if (r > 0.96) { pSize = 7.0; pColor = colCanopy; y += 3.0; } 
                        else if (r > 0.6) { pSize = 2.5; pColor = colLand2; }
                        else { pSize = 1.5; pColor = colLand3; }
                    }
                }
                if (keepPoint) { positions.push(x, y, z); colors.push(pColor.r, pColor.g, pColor.b); sizes.push(pSize); }
            }
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: { uMouse: { value: new THREE.Vector3(0, 0, 0) } },
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            transparent: true, depthTest: true, depthWrite: false
        });
        const terrain = new THREE.Points(geometry, shaderMaterial);
        scene.add(terrain);

        // --- 5. 种群系统 ---
        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        class SpeciesSwarm {
            constructor(name, normalFile, mutantFile, centerPos) {
                this.name = name;
                this.center = centerPos.clone();
                this.group = new THREE.Group();
                scene.add(this.group);

                this.boids = []; 
                this.state = 'swarm'; 
                this.modelGroup = new THREE.Group(); 
                this.group.add(this.modelGroup);
                this.modelGroup.visible = false; 

                // 几何体群 (深色)
                const count = 10;
                const boidGeo = new THREE.ConeGeometry(0.8, 2, 4); 
                for(let i=0; i<count; i++) {
                    const isMutant = Math.random() > 0.8;
                    const color = isMutant ? 0xcc3333 : (Math.random()>0.5 ? 0x444444 : 0x222222);
                    const mat = new THREE.MeshBasicMaterial({ color: color, wireframe: true });
                    const mesh = new THREE.Mesh(boidGeo, mat);
                    const offset = new THREE.Vector3((Math.random()-0.5)*20, (Math.random()-0.5)*10, (Math.random()-0.5)*20);
                    mesh.position.copy(this.center).add(offset);
                    mesh.userData = { offset: offset, phase: Math.random() * Math.PI };
                    scene.add(mesh); 
                    this.boids.push(mesh);
                }

                loader.load(normalFile, (gltf) => {
                    this.normalMesh = gltf.scene;
                    this.normalMesh.scale.set(5,5,5); 
                    this.modelGroup.add(this.normalMesh);
                    if(gltf.animations.length>0) {
                        this.nmMixer = new THREE.AnimationMixer(this.normalMesh);
                        this.nmMixer.clipAction(gltf.animations[0]).play();
                    }
                });
                loader.load(mutantFile, (gltf) => {
                    this.mutantMesh = gltf.scene;
                    this.mutantMesh.scale.set(0.1,0.1,0.1); 
                    this.mutantMesh.visible = false;
                    this.modelGroup.add(this.mutantMesh);
                    if(gltf.animations.length>0) {
                        this.mmMixer = new THREE.AnimationMixer(this.mutantMesh);
                        this.mmMixer.clipAction(gltf.animations[0]).play();
                    }
                });
            }

            update(delta) {
                const time = Date.now() * 0.001;
                this.boids.forEach((boid, i) => {
                    if (this.state === 'focused') {
                        boid.visible = false;
                    } else {
                        boid.visible = true;
                        boid.position.x = this.center.x + boid.userData.offset.x + Math.sin(time + boid.userData.phase) * 5;
                        boid.position.z = this.center.z + boid.userData.offset.z + Math.cos(time + boid.userData.phase * 0.5) * 5;
                        const y = getElevation(boid.position.x, boid.position.z);
                        boid.position.y = y + 5 + Math.sin(time * 2 + i) * 2;
                        boid.rotation.y += 0.02;
                    }
                });
                const centerY = getElevation(this.center.x, this.center.z);
                this.modelGroup.position.set(this.center.x, centerY + 5, this.center.z);
                if(this.nmMixer) this.nmMixer.update(delta);
                if(this.mmMixer) this.mmMixer.update(delta);
            }

            hover(isHovering) {
                if (this.state === 'focused') return;
                if (isHovering && this.state !== 'hover') {
                    this.state = 'hover';
                    this.modelGroup.visible = true;
                    gsap.to(this.modelGroup.scale, {x:1, y:1, z:1, duration:0.5});
                    this.boids.forEach(b => gsap.to(b.scale, {x:0, y:0, z:0, duration:0.3}));
                } 
                else if (!isHovering && this.state === 'hover') {
                    this.state = 'swarm';
                    this.modelGroup.visible = false;
                    this.boids.forEach(b => gsap.to(b.scale, {x:1, y:1, z:1, duration:0.5, delay:0.2}));
                }
            }

            focus() {
                if (this.state === 'focused') return;
                this.state = 'focused';
                this.modelGroup.visible = true;
                const tl = gsap.timeline();
                if(this.normalMesh) {
                    tl.to(this.normalMesh.position, {x:0.5, duration:0.05, yoyo:true, repeat:5})
                      .to(this.normalMesh.scale, {x:0.1, y:0.1, z:0.1, duration:0.2});
                }
                tl.add(() => {
                    if(this.normalMesh) this.normalMesh.visible = false;
                    if(this.mutantMesh) this.mutantMesh.visible = true;
                });
                if(this.mutantMesh) {
                    tl.fromTo(this.mutantMesh.scale, {x:0.1, y:0.1, z:0.1}, {x:7.5, y:7.5, z:7.5, duration:0.6, ease:"back.out(1.7)"});
                }
            }

            unfocus() {
                if (this.state !== 'focused') return;
                this.state = 'swarm';
                const tl = gsap.timeline();
                if(this.mutantMesh) tl.to(this.mutantMesh.scale, {x:0.1, y:0.1, z:0.1, duration:0.3});
                tl.add(() => {
                    if(this.mutantMesh) this.mutantMesh.visible = false;
                    if(this.normalMesh) {
                        this.normalMesh.visible = true;
                        this.normalMesh.scale.set(5,5,5);
                    }
                    this.modelGroup.visible = false;
                });
                this.boids.forEach(b => {
                    b.visible = true;
                    gsap.to(b.scale, {x:1, y:1, z:1, duration:0.5});
                });
            }
        }

        const swarms = [
            new SpeciesSwarm("POLYMER TURTLE", "./wugui.glb", "./bwugui.glb", new THREE.Vector3(0, 0, 0)),
            new SpeciesSwarm("PLASTIC CRAB", "./xie.glb", "./bxie.glb", new THREE.Vector3(30, 0, 30)),
            new SpeciesSwarm("OIL BIRD", "./niao.glb", "./bniao.glb", new THREE.Vector3(-40, 0, -40)),
            new SpeciesSwarm("FIBER JELLY", "./shuimu.glb", "./bshuimu.glb", new THREE.Vector3(0, 0, -60)),
            new SpeciesSwarm("SONAR DOLPHIN", "./haitun.glb", "./bhaitun.glb", new THREE.Vector3(-50, 0, 20)),
            new SpeciesSwarm("TOXIC SNAKE", "./she.glb", "./bshe.glb", new THREE.Vector3(50, 0, 50)),
            new SpeciesSwarm("ACID FROG", "./wa.glb", "./bwa.glb", new THREE.Vector3(-60, 0, 0)),
            new SpeciesSwarm("RADIOACTIVE FISH", "./yu.glb", "./byu.glb", new THREE.Vector3(60, 0, -20)),
            new SpeciesSwarm("GHOST SEAL", "./bao.glb", "./bhaibao.glb", new THREE.Vector3(20, 0, -80))
        ];

        // --- 6. 交互逻辑 ---
        const clock = new THREE.Clock();
        const panel = document.getElementById('data-panel');
        let focusedSwarm = null; 
        
        // 全局关闭函数
        window.closePanel = function() {
            if (focusedSwarm) {
                focusedSwarm.unfocus();
                focusedSwarm = null;
                
                // 镜头拉远
                gsap.to(camera.position, {x: 0, y: 60, z: 80, duration: 1.5, ease: "power2.inOut"});
                gsap.to(controls.target, {x: 0, y: 0, z: 0, duration: 1.5});
                
                // 隐藏面板
                panel.classList.remove('active');
                setTimeout(() => panel.style.display = 'none', 300);
                
                // 隐藏相机
                droneGroup.visible = false;
            }
        };

        document.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(hitPlane);
            if (intersects.length > 0) {
                mouseWorld.copy(intersects[0].point);
                shaderMaterial.uniforms.uMouse.value.copy(intersects[0].point);
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('close-btn')) return; // 点击关闭按钮时不触发地图点击

            let clickedSwarm = null;
            swarms.forEach(swarm => {
                const dist = new THREE.Vector2(swarm.center.x, swarm.center.z).distanceTo(new THREE.Vector2(mouseWorld.x, mouseWorld.z));
                if (dist < 15) clickedSwarm = swarm;
            });

            if (clickedSwarm) {
                if (focusedSwarm !== clickedSwarm) {
                    if(focusedSwarm) focusedSwarm.unfocus();
                    focusedSwarm = clickedSwarm;
                    focusedSwarm.focus();

                    // 镜头推进
                    const targetPos = focusedSwarm.modelGroup.position;
                    gsap.to(camera.position, {x: targetPos.x + 20, y: targetPos.y + 20, z: targetPos.z + 20, duration: 1.5, ease: "power2.inOut"});
                    gsap.to(controls.target, {x: targetPos.x, y: targetPos.y, z: targetPos.z, duration: 1.5});

                    // 面板显示
                    panel.style.display = 'block';
                    // 强制回流
                    void panel.offsetWidth; 
                    panel.classList.add('active');
                    
                    document.getElementById('panel-name').innerText = focusedSwarm.name;
                    document.getElementById('panel-desc').innerText = "Analyzing... Genetic mutation level critical.";
                    document.getElementById('bar-tox').style.width = Math.random()*50 + 50 + "%";
                    document.getElementById('bar-adp').style.width = Math.random()*50 + 50 + "%";

                    // 🎥 无人机相机启动！
                    droneGroup.visible = true;
                }
            } else {
                // 点击空白处关闭
                if (focusedSwarm) window.closePanel();
            }
        });

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = Date.now() * 0.001;

            if (focusedSwarm) {
                cursorGroup.scale.set(0,0,0);
                
                // 🎥 更新无人机相机运动
                // 让它绕着变异动物旋转
                const targetPos = focusedSwarm.modelGroup.position;
                droneGroup.position.x = targetPos.x + Math.sin(time) * 15;
                droneGroup.position.z = targetPos.z + Math.cos(time) * 15;
                droneGroup.position.y = targetPos.y + 8 + Math.sin(time*2)*1; // 上下浮动
                droneGroup.lookAt(targetPos);
                
                // 红灯闪烁
                recLight.material.color.setHex((Date.now() % 1000 < 500) ? 0xff0000 : 0x330000);

            } else {
                cursorGroup.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
                let hoverSwarm = null;
                swarms.forEach(swarm => {
                    const dist = new THREE.Vector2(swarm.center.x, swarm.center.z).distanceTo(new THREE.Vector2(mouseWorld.x, mouseWorld.z));
                    if (dist < 20) hoverSwarm = swarm;
                    swarm.hover(dist < 20);
                    swarm.update(delta);
                });

                if (hoverSwarm) {
                    hexMaterial.color.set(0xff4444);
                    cursorGroup.scale.lerp(new THREE.Vector3(1.5, 1.5, 1.5), 0.1);
                } else {
                    hexMaterial.color.set(0x333333);
                }

                const targetY = getElevation(mouseWorld.x, mouseWorld.z);
                cursorGroup.position.x += (mouseWorld.x - cursorGroup.position.x) * 0.2;
                cursorGroup.position.z += (mouseWorld.z - cursorGroup.position.z) * 0.2;
                cursorGroup.position.y += (targetY - cursorGroup.position.y) * 0.2;
                cursorHex.rotation.z += 0.01;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        
        setTimeout(() => { document.getElementById('loading').style.opacity = 0; }, 2000);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
