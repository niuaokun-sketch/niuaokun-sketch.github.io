<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>ECO-MONITOR | 废土档案版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        /* --- 1. 基础设置 --- */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #e6d8c3;
            cursor: none;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* =========================
           ✅ 更深雾霾色过渡 + 灰尘（性能友好）
           - 雾霾：静态渐变（不卡）
           - 灰尘：少量深色小点 + 低FPS
           - 底部渐隐：自然过渡到消失
           ========================= */
        #atmo-layer{
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 78vh;
            pointer-events: none;
            z-index: 60;

            /* ✅整体更“厚”一点 */
            opacity: 0.80;

            transition: opacity .35s ease;
            overflow: hidden;

            -webkit-mask-image: linear-gradient(to bottom,
                rgba(0,0,0,1) 0%,
                rgba(0,0,0,1) 55%,
                rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom,
                rgba(0,0,0,1) 0%,
                rgba(0,0,0,1) 55%,
                rgba(0,0,0,0) 100%);
        }

        /* ✅ 聚焦动物：雾霾层淡出（避免盖住动物） */
        body.focus-mode #atmo-layer{
            opacity: 0.12;
        }

        /* ✅ 更深更脏的雾霾色：偏棕橙 + 层次更明显（静态不动画） */
        #haze-gradient{
            position:absolute;
            inset:0;
            background:
              linear-gradient(to bottom,
                rgba(140, 92, 52, 0.92) 0%,   /* 顶部更深（接近你图的棕橙暗雾） */
                rgba(160, 110, 68, 0.62) 28%,
                rgba(190, 150, 110, 0.28) 62%,
                rgba(230, 216, 195, 0.00) 100%);
        }

        /* ✅ 轻微压暗（提升“空气厚度”），仍然静态 */
        #haze-vignette{
            position:absolute;
            inset:0;
            background: radial-gradient(120% 90% at 50% 8%,
                rgba(0,0,0,0.10) 0%,
                rgba(0,0,0,0.06) 45%,
                rgba(0,0,0,0.00) 80%);
            mix-blend-mode: multiply;
            opacity: 0.65;
        }

        /* 灰尘 Canvas */
        #dust-canvas{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            display:block;
        }

        /* --- 2. UI 层 --- */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: none;
            opacity: 0; transition: opacity 0.5s;
            z-index: 999;
        }
        #ui-layer.active { display: block; opacity: 1; }

        .left-panel {
            position: absolute; left: 5%; top: 20%;
            display: flex; flex-direction: column; align-items: flex-start;
            pointer-events: auto;
        }
        .title-box {
            background-color: #cc3333; color: white;
            padding: 15px 30px; font-size: 32px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            margin-bottom: 0;
        }
        .pollution-alert {
            background-color: #ffcc00; color: #222;
            padding: 15px 25px; margin-top: 15px; margin-bottom: 5px;
            font-weight: 900; font-size: 14px; letter-spacing: 1px;
            border-left: 8px solid #222;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 350px;
        }
        .pollution-label { display: block; font-size: 10px; opacity: 0.7; margin-bottom: 5px; }
        .pollution-value { font-size: 18px; text-transform: uppercase; }

        .stat-box {
            background-color: #333; color: #ccc;
            padding: 10px 20px; margin-top: 2px;
            font-size: 12px; font-weight: 600; letter-spacing: 1px;
            min-width: 200px;
        }
        .stat-box span { color: #fff; margin-left: 10px; }

        .right-panel {
            position: absolute; right: 5%; bottom: 8%; top: 15%;
            width: 450px;
            background-color: rgba(30, 30, 30, 0.95);
            color: #ddd;
            padding: 0;
            border-left: 6px solid #cc3333;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .video-box {
            width: 100%; height: 260px;
            background: #000;
            border-bottom: 1px solid #555;
            overflow: hidden; position: relative; flex-shrink: 0;
        }
        #ui-video { width: 100%; height: 100%; object-fit: cover; opacity: 0.95; }
        .rec-tag {
            position: absolute; top: 15px; left: 15px;
            color: #ff0000; font-size: 12px; font-weight: bold;
            animation: blink 1s infinite; z-index: 10; letter-spacing: 1px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .scroll-container {
            flex-grow: 1; overflow-y: auto; padding: 30px; padding-bottom: 50px;
        }
        .scroll-container::-webkit-scrollbar { width: 6px; }
        .scroll-container::-webkit-scrollbar-track { background: #222; }
        .scroll-container::-webkit-scrollbar-thumb { background: #cc3333; border-radius: 3px; }

        .desc-text {
            font-size: 14px; line-height: 1.8; margin-bottom: 25px;
            font-style: normal; color: #eee; text-align: justify;
            border-bottom: 1px solid #555; padding-bottom: 25px;
        }
        .detail-list { font-size: 13px; color: #aaa; line-height: 1.7; }
        .detail-item { margin-bottom: 15px; }
        .detail-label {
            display: block; color: #ff6666; font-weight: 800; margin-bottom: 5px;
            text-transform: uppercase; letter-spacing: 1px; font-size: 11px;
        }

        .close-btn {
            position: absolute; top: 20px; right: -70px;
            width: 50px; height: 50px;
            border: 2px solid #333; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; color: #333; font-size: 30px;
            transition: all 0.3s; pointer-events: auto;
            background: rgba(230, 216, 195, 0.9);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index: 200;
        }
        .close-btn:hover { background: #333; color: #fff; transform: rotate(90deg); }

        #ui-header { position: absolute; top: 30px; left: 40px; color: #554433; pointer-events: none; z-index: 10; transition: opacity 0.3s; }
        h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
        p { margin: 5px 0 0 0; font-size: 11px; color: #886644; font-weight: 600; }

        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #886644; font-size: 12px;
            pointer-events: none;
            transition: opacity 0.5s; font-weight: bold;
            z-index: 10;
        }

        body.active-mode { cursor: auto !important; }
        #ui-layer:hover, .close-btn:hover { cursor: default; }
    </style>
</head>

        {

    <script type="x-shader/x-vertex" id="vertexShader">
        uniform vec3 uMouse;
        attribute float size;
        attribute vec3 customColor;
        varying vec3 vColor;
        void main() {
            vColor = customColor;
            vec3 pos = position;
            float dist = distance(pos.xz, uMouse.xz);
            float radius = 7.0;
            if (dist < radius) {
                vec3 dir = normalize(pos - uMouse);
                float force = (radius - dist) / radius;
                pos.x += dir.x * force * 3.0;
                pos.z += dir.z * force * 3.0;
            }
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = size * (200.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentShader">
        varying vec3 vColor;
        void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            float alpha = 1.0 - smoothstep(0.4, 0.5, dist);
            if (alpha < 0.01) discard;
            gl_FragColor = vec4(vColor, alpha);
        }
    </script>

                look: "身体半透明，骨架发出幽幽蓝光。头部严重不对称，随机分布着多只大小不一的眼睛，有些甚至长在背部或侧腹。",
                act: "游动姿势抽搐且不规律，仿佛神经系统处于持续短路状态。对光线极度敏感，遇到强光会剧烈痉挛，通常躲藏在反应堆废墟的阴影中。"
            },
            "GHOST SEAL": {
                video: "./haibao.mp4", name: "幽灵网缚海豹", latin: "PHOCA LAQUEUS", source: "废弃渔网缠绕", pollutant: "聚酰胺纤维 (Polyamide)", tox: "50%",
                desc: "这只海豹在幼年时不幸钻入了一团废弃的尼龙渔网。随着它的生长，坚韧的渔网并没有断裂，而是深深勒入了皮肉，甚至切断了部分骨骼，最终被新生的组织包裹，与身体完全长在了一起。渔网成为了它身体的一部分，一种痛苦的外骨骼。这不仅限制了它的生长，还引起了慢性的全身性炎症，时刻提醒着人类垃圾对海洋生物的终身折磨。",
                look: "颈部和躯干嵌着彩色的尼龙绳索，伤口处有巨大的增生肉瘤。身体因长期勒痕而呈现出葫芦状的畸形。",
                act: "性格极度暴躁，处于长期的疼痛狂躁中。会主动攻击并撕咬任何绳索状的物体，试图摆脱那不存在的束缚，常被误认为是狂犬病发作。"
            }
        };

        // --- 1. 场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe6d8c3);
        scene.fog = new THREE.FogExp2(0xe6d8c3, 0.012);

        const ambientLight = new THREE.AmbientLight(0xffeedd, 3.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffaa77, 3.0);
        dirLight.position.set(50, 80, 50);
        scene.add(dirLight);

        const cameraLight = new THREE.DirectionalLight(0xffffff, 1.5);
        scene.add(cameraLight);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 60, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // --- 2. 光标 ---
        const cursorGroup = new THREE.Group();
        scene.add(cursorGroup);
        const hexGeometry = new THREE.RingGeometry(3.5, 4.2, 6);
        const hexMaterial = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const cursorHex = new THREE.Mesh(hexGeometry, hexMaterial);
        cursorHex.rotation.x = -Math.PI / 2;
        cursorGroup.add(cursorHex);
        const triGeo = new THREE.ConeGeometry(0.8, 2, 3);
        const triMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
        const cursorTri = new THREE.Mesh(triGeo, triMat);
        cursorTri.rotation.x = Math.PI; cursorTri.position.y = 6;
        cursorGroup.add(cursorTri);

        // --- 3. 无人机 ---
        const droneGroup = new THREE.Group();
        scene.add(droneGroup);
        droneGroup.visible = false;
        const camBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 2), new THREE.MeshBasicMaterial({ color: 0x222222 }));
        droneGroup.add(camBody);
        const camLens = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.8, 16), new THREE.MeshBasicMaterial({ color: 0x666666 }));
        camLens.rotation.x = Math.PI / 2; camLens.position.z = 1.2;
        droneGroup.add(camLens);
        const recLight = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
        recLight.position.set(0.6, 0.6, 1.0);
        droneGroup.add(recLight);

        // --- 4. 射线 & 地形 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const mouseWorld = new THREE.Vector3();
        const hitPlane = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshBasicMaterial({ visible: false }));
        hitPlane.rotation.x = -Math.PI / 2;
        scene.add(hitPlane);

        const geometry = new THREE.BufferGeometry();
        const positions = []; const colors = []; const sizes = [];

        const colWater = new THREE.Color("#668899");
        const colLand1 = new THREE.Color("#ccaa66");
        const colLand2 = new THREE.Color("#885533");
        const colCanopy = new THREE.Color("#444433");

        const range = 180; const gap = 2.5;
        function getElevation(x, z) { return Math.sin(x * 0.05) * 8 + Math.cos(z * 0.05) * 8; }

        for (let x = -range; x < range; x += gap) {
            for (let z = -range; z < range; z += gap) {
                const distToCenter = Math.sqrt(x*x + z*z);
                const maxRadius = 120 + Math.sin(Math.atan2(z, x) * 5.0) * 15.0 + Math.cos(x * 0.1) * 10.0;
                if (distToCenter > maxRadius) continue;

                let y = getElevation(x, z);
                let pSize = 0.0; let pColor = new THREE.Color(); let keepPoint = false;

                if (y < -3) {
                    if (Math.random() > 0.4) { pSize = 4.0; pColor = colWater; keepPoint = true; }
                } else {
                    if (Math.random() > 0.5) {
                        keepPoint = true;
                        const r = Math.random();
                        if (r > 0.96) { pSize = 7.0; pColor = colCanopy; y += 3.0; }
                        else if (r > 0.6) { pSize = 2.5; pColor = colLand2; }
                        else { pSize = 1.5; pColor = colLand1; }
                    }
                }
                if (keepPoint) { positions.push(x, y, z); colors.push(pColor.r, pColor.g, pColor.b); sizes.push(pSize); }
            }
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: { uMouse: { value: new THREE.Vector3(0, 0, 0) } },
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            transparent: true, depthTest: true, depthWrite: false
        });

        const terrain = new THREE.Points(geometry, shaderMaterial);
        scene.add(terrain);

        // --- 5. 种群系统 ---
        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        class SpeciesSwarm {
            constructor(name, normalFile, mutantFile, centerPos) {
                this.name = name;
                this.center = centerPos.clone();
                this.group = new THREE.Group();
                scene.add(this.group);
                this.group.userData = { isSwarm: true, swarmName: name };

                this.boids = [];
                this.state = 'swarm';

                this.modelGroup = new THREE.Group();
                this.turntable = new THREE.Group();
                this.group.add(this.modelGroup);
                this.modelGroup.add(this.turntable);
                this.modelGroup.visible = false;

                const count = 10;
                const boidGeo = new THREE.ConeGeometry(0.8, 2, 4);
                for(let i=0; i<count; i++) {
                    const isMutant = Math.random() > 0.8;
                    const color = isMutant ? 0xcc3333 : (Math.random()>0.5 ? 0x666666 : 0x333333);
                    const mat = new THREE.MeshBasicMaterial({ color: color, wireframe: true });
                    const mesh = new THREE.Mesh(boidGeo, mat);
                    const offset = new THREE.Vector3((Math.random()-0.5)*20, (Math.random()-0.5)*10, (Math.random()-0.5)*20);
                    mesh.position.copy(this.center).add(offset);
                    mesh.userData = { offset: offset, phase: Math.random() * Math.PI };
                    scene.add(mesh);
                    this.boids.push(mesh);
                }

                loader.load(normalFile, (gltf) => {
                    this.normalMesh = gltf.scene;
                    this.normalMesh.scale.set(5,5,5);
                    this.turntable.add(this.normalMesh);
                    if(gltf.animations.length>0) {
                        this.nmMixer = new THREE.AnimationMixer(this.normalMesh);
                        this.nmMixer.clipAction(gltf.animations[0]).play();
                    }
                }, undefined, () => {});

                loader.load(mutantFile, (gltf) => {
                    this.mutantMesh = gltf.scene;
                    this.mutantMesh.scale.set(0.1,0.1,0.1);
                    this.mutantMesh.visible = false;
                    this.turntable.add(this.mutantMesh);
                    if(gltf.animations.length>0) {
                        this.mmMixer = new THREE.AnimationMixer(this.mutantMesh);
                        this.mmMixer.clipAction(gltf.animations[0]).play();
                    }
                }, undefined, () => {});
            }

            update(delta) {
                const time = Date.now() * 0.001;

                this.boids.forEach((boid, i) => {
                    if (this.state === 'focused') {
                        boid.visible = false;
                    } else {
                        boid.visible = true;
                        boid.position.x = this.center.x + boid.userData.offset.x + Math.sin(time + boid.userData.phase) * 5;
                        boid.position.z = this.center.z + boid.userData.offset.z + Math.cos(time + boid.userData.phase * 0.5) * 5;
                        const y = getElevation(boid.position.x, boid.position.z);
                        boid.position.y = y + 5 + Math.sin(time * 2 + i) * 2;
                        boid.rotation.y += 0.02;
                    }
                });

                const centerY = getElevation(this.center.x, this.center.z);
                this.modelGroup.position.set(this.center.x, centerY + 5, this.center.z);

                if (this.state === 'focused') {
                    this.turntable.rotation.y -= 0.015;
                    this.modelGroup.position.y = centerY + 12 + Math.sin(time * 1.5) * 1.5;
                } else {
                    this.turntable.rotation.y = 0;
                }

                if(this.nmMixer) this.nmMixer.update(delta);
                if(this.mmMixer) this.mmMixer.update(delta);
            }

            hover(isHovering) {
                if (this.state === 'focused') return;
                if (isHovering && this.state !== 'hover') {
                    this.state = 'hover';
                    this.modelGroup.visible = true;
                    this.turntable.scale.set(1,1,1);
                    gsap.to(this.turntable.scale, {x:1, y:1, z:1, duration:0.5});
                    this.boids.forEach(b => gsap.to(b.scale, {x:0, y:0, z:0, duration:0.3}));
                }
                else if (!isHovering && this.state === 'hover') {
                    this.state = 'swarm';
                    this.modelGroup.visible = false;
                    this.boids.forEach(b => gsap.to(b.scale, {x:1, y:1, z:1, duration:0.5, delay:0.2}));
                }
            }

            focus() {
                if (this.state === 'focused') return;
                this.state = 'focused';
                document.body.classList.add('focus-mode');

                this.modelGroup.visible = true;
                const tl = gsap.timeline();
                if(this.normalMesh) {
                    tl.to(this.normalMesh.position, {x:0.5, duration:0.05, yoyo:true, repeat:5})
                      .to(this.normalMesh.scale, {x:0.1, y:0.1, z:0.1, duration:0.2});
                }
                tl.add(() => {
                    if(this.normalMesh) this.normalMesh.visible = false;
                    if(this.mutantMesh) this.mutantMesh.visible = true;
                });
                if(this.mutantMesh) {
                    tl.fromTo(this.mutantMesh.scale,
                        {x:0.1, y:0.1, z:0.1},
                        {x:30, y:30, z:30, duration:0.8, ease:"back.out(1.2)"}
                    );
                }
            }

            unfocus() {
                if (this.state !== 'focused') return;
                this.state = 'swarm';
                document.body.classList.remove('focus-mode');

                const tl = gsap.timeline();
                if(this.mutantMesh) tl.to(this.mutantMesh.scale, {x:0.1, y:0.1, z:0.1, duration:0.3});
                tl.add(() => {
                    if(this.mutantMesh) this.mutantMesh.visible = false;
                    if(this.normalMesh) {
                        this.normalMesh.visible = true;
                        this.normalMesh.scale.set(5,5,5);
                    }
                    this.modelGroup.visible = false;
                });
                this.boids.forEach(b => {
                    b.visible = true;
                    gsap.to(b.scale, {x:1, y:1, z:1, duration:0.5});
                });
            }
        }

        const swarms = [
            new SpeciesSwarm("POLYMER TURTLE", "./wugui.glb", "./bwugui.glb", new THREE.Vector3(0, 0, 0)),
            new SpeciesSwarm("PLASTIC CRAB", "./xie.glb", "./bxie.glb", new THREE.Vector3(30, 0, 30)),
            new SpeciesSwarm("OIL BIRD", "./niao.glb", "./bniao.glb", new THREE.Vector3(-40, 0, -40)),
            new SpeciesSwarm("FIBER JELLY", "./shuimu.glb", "./bshuimu.glb", new THREE.Vector3(0, 0, -60)),
            new SpeciesSwarm("SONAR DOLPHIN", "./haitun.glb", "./bhaitun.glb", new THREE.Vector3(-50, 0, 20)),
            new SpeciesSwarm("TOXIC SNAKE", "./she.glb", "./bshe.glb", new THREE.Vector3(50, 0, 50)),
            new SpeciesSwarm("ACID FROG", "./wa.glb", "./bwa.glb", new THREE.Vector3(-60, 0, 0)),
            new SpeciesSwarm("RADIOACTIVE FISH", "./yu.glb", "./byu.glb", new THREE.Vector3(60, 0, -20)),
            new SpeciesSwarm("GHOST SEAL", "./bao.glb", "./bhaibao.glb", new THREE.Vector3(20, 0, -80))
        ];

        // --- 6. 交互逻辑 ---
        const clock = new THREE.Clock();
        const uiLayer = document.getElementById('ui-layer');
        const videoEl = document.getElementById('ui-video');
        let focusedSwarm = null;

        window.closePanel = function() {
            if (focusedSwarm) {
                focusedSwarm.unfocus();
                focusedSwarm = null;

                videoEl.pause();
                videoEl.currentTime = 0;

                gsap.to(camera.position, {x: 0, y: 60, z: 80, duration: 1.5, ease: "power2.inOut"});
                gsap.to(controls.target, {x: 0, y: 0, z: 0, duration: 1.5});

                uiLayer.classList.remove('active');
                document.getElementById('ui-header').style.opacity = 1;
                document.body.classList.remove('active-mode');

                droneGroup.visible = false;
            } else {
                document.body.classList.remove('focus-mode');
            }
        };

        document.addEventListener('mousemove', (e) => {
            if (!focusedSwarm) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(hitPlane);
                if (intersects.length > 0) {
                    mouseWorld.copy(intersects[0].point);
                    shaderMaterial.uniforms.uMouse.value.copy(intersects[0].point);
                }
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.closest('.close-btn') || e.target.closest('.right-panel') || e.target.closest('.left-panel')) return;

            let clickedSwarm = null;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(scene.children, true);

            for(let hit of intersects) {
                let obj = hit.object;
                while(obj) {
                    if (obj.userData && obj.userData.isSwarm) {
                        clickedSwarm = swarms.find(s => s.name === obj.userData.swarmName);
                        break;
                    }
                    obj = obj.parent;
                }
                if (clickedSwarm) break;
            }

            if (!clickedSwarm) {
                swarms.forEach(swarm => {
                    const dist = new THREE.Vector2(swarm.center.x, swarm.center.z).distanceTo(new THREE.Vector2(mouseWorld.x, mouseWorld.z));
                    if (dist < 15) clickedSwarm = swarm;
                });
            }

            if (clickedSwarm) {
                if (focusedSwarm !== clickedSwarm) {
                    if(focusedSwarm) focusedSwarm.unfocus();
                    focusedSwarm = clickedSwarm;
                    focusedSwarm.focus();

                    const targetPos = focusedSwarm.modelGroup.position;
                    gsap.to(camera.position, {
                        x: targetPos.x + 50,
                        y: targetPos.y + 30,
                        z: targetPos.z + 80,
                        duration: 1.5,
                        ease: "power2.inOut"
                    });
                    gsap.to(controls.target, {x: targetPos.x, y: targetPos.y, z: targetPos.z, duration: 1.5});

                    const data = animalData[focusedSwarm.name] || {};
                    const safeSetText = (id, text) => {
                        const el = document.getElementById(id);
                        if(el) el.innerText = text;
                    };

                    safeSetText('ui-name', data.name || focusedSwarm.name);
                    safeSetText('ui-latin', data.latin || "Unknown");
                    safeSetText('ui-pollutant', data.pollutant || "UNKNOWN");
                    safeSetText('ui-tox', data.tox || "0%");
                    safeSetText('ui-desc', data.desc || '...');
                    safeSetText('ui-look', data.look || "...");
                    safeSetText('ui-act', data.act || "...");

                    if (data.video) {
                        videoEl.src = data.video;
                        videoEl.load();
                        videoEl.oncanplay = () => { videoEl.play().catch(()=>{}); };
                    }

                    uiLayer.classList.add('active');
                    document.getElementById('ui-header').style.opacity = 0;
                    document.body.classList.add('active-mode');

                    droneGroup.visible = true;
                }
            } else {
                if (focusedSwarm) window.closePanel();
            }
        });

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = Date.now() * 0.001;

            cameraLight.position.copy(camera.position);

            if (focusedSwarm) {
                cursorGroup.scale.set(0,0,0);
                const targetPos = focusedSwarm.modelGroup.position;
                droneGroup.position.x = targetPos.x + Math.sin(time) * 35;
                droneGroup.position.z = targetPos.z + Math.cos(time) * 35;
                droneGroup.position.y = targetPos.y + 25 + Math.sin(time*2)*2;
                droneGroup.lookAt(targetPos);
                recLight.material.color.setHex((Date.now() % 1000 < 500) ? 0xff0000 : 0x330000);
            } else {
                cursorGroup.scale.lerp(new THREE.Vector3(1,1,1), 0.1);

                let hoverSwarm = null;
                swarms.forEach(swarm => {
                    const dist = new THREE.Vector2(swarm.center.x, swarm.center.z)
                        .distanceTo(new THREE.Vector2(mouseWorld.x, mouseWorld.z));
                    if (dist < 20) hoverSwarm = swarm;
                    swarm.hover(dist < 20);
                });

                if (hoverSwarm) {
                    hexMaterial.color.set(0xff4444);
                    cursorGroup.scale.lerp(new THREE.Vector3(1.5, 1.5, 1.5), 0.1);
                } else {
                    hexMaterial.color.set(0x444444);
                }

                const targetY = getElevation(mouseWorld.x, mouseWorld.z);
                cursorGroup.position.x += (mouseWorld.x - cursorGroup.position.x) * 0.2;
                cursorGroup.position.z += (mouseWorld.z - cursorGroup.position.z) * 0.2;
                cursorGroup.position.y += (targetY - cursorGroup.position.y) * 0.2;
                cursorHex.rotation.z += 0.01;
            }

            swarms.forEach(swarm => swarm.update(delta));

            controls.update();
            renderer.render(scene, camera);
        }

        setTimeout(() => { document.getElementById('loading').style.opacity = 0; }, 2000);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* =========================
           ✅ 灰尘（深色小点）低FPS
           ========================= */
        (function initDust(){
            const layer = document.getElementById('atmo-layer');
            const canvas = document.getElementById('dust-canvas');
            const ctx = canvas.getContext('2d', { alpha: true });

            let W=0, H=0, DPR=Math.min(window.devicePixelRatio||1, 2);

            function resizeDust(){
                const r = layer.getBoundingClientRect();
                W = Math.max(1, Math.floor(r.width));
                H = Math.max(1, Math.floor(r.height));
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                ctx.setTransform(DPR,0,0,DPR,0,0);
            }
            resizeDust();
            window.addEventListener('resize', resizeDust);

            const FPS = 22;
            const COUNT = 85;

            const dots = [];
            const rand = (a,b)=>a+Math.random()*(b-a);

            function spawn(){
                return {
                    x: rand(0, W),
                    y: rand(0, H),
                    r: rand(0.6, 1.7),
                    a: rand(0.10, 0.20),
                    vx: rand(-2.4, -0.5),
                    vy: rand(-0.25, 0.25),
                    phase: rand(0, Math.PI*2),
                    w: rand(0.12, 0.40)
                };
            }
            for(let i=0;i<COUNT;i++) dots.push(spawn());

            function tick(){
                if(document.body.classList.contains('focus-mode')){
                    ctx.clearRect(0,0,W,H);
                    return;
                }

                ctx.clearRect(0,0,W,H);

                for(const d of dots){
                    d.phase += 0.015;
                    d.x += d.vx * (1/FPS);
                    d.y += d.vy * (1/FPS) + Math.sin(d.phase)*d.w*(1/FPS);

                    if(d.x < -10) d.x = W + 10;
                    if(d.y < -10) d.y = H + 10;
                    if(d.y > H + 10) d.y = -10;

                    ctx.beginPath();
                    ctx.fillStyle = `rgba(45, 40, 34, ${d.a})`;
                    ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            setInterval(tick, 1000/FPS);
        })();
    </script>
</body>
