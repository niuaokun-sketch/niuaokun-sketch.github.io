    <script type="x-shader/x-vertex" id="vertexShader">
        uniform vec3 uMouse;
        attribute float size;
        attribute vec3 customColor;
        varying vec3 vColor;
        void main() {
            vColor = customColor;
            vec3 pos = position;
            float dist = distance(pos.xz, uMouse.xz);
            float radius = 7.0; 
            if (dist < radius) {
                vec3 dir = normalize(pos - uMouse);
                float force = (radius - dist) / radius;
                pos.x += dir.x * force * 3.0; 
                pos.z += dir.z * force * 3.0;
            }
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = size * (200.0 / -mvPosition.z); 
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentShader">
        varying vec3 vColor;
        void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            float alpha = 1.0 - smoothstep(0.4, 0.5, dist);
            if (alpha < 0.01) discard;
            gl_FragColor = vec4(vColor, alpha); 
        }
    </script>

                this.modelGroup.visible = false; 

                // 几何体群
                const count = 10;
                const boidGeo = new THREE.ConeGeometry(0.8, 2, 4); 
                for(let i=0; i<count; i++) {
                    const isMutant = Math.random() > 0.8;
                    const color = isMutant ? 0xcc3333 : (Math.random()>0.5 ? 0x444444 : 0x222222);
                    const mat = new THREE.MeshBasicMaterial({ color: color, wireframe: true });
                    const mesh = new THREE.Mesh(boidGeo, mat);
                    const offset = new THREE.Vector3((Math.random()-0.5)*20, (Math.random()-0.5)*10, (Math.random()-0.5)*20);
                    mesh.position.copy(this.center).add(offset);
                    mesh.userData = { offset: offset, phase: Math.random() * Math.PI };
                    scene.add(mesh); 
                    this.boids.push(mesh);
                }

                // 加载模型
                loader.load(normalFile, (gltf) => {
                    this.normalMesh = gltf.scene;
                    this.normalMesh.scale.set(5,5,5); 
                    this.modelGroup.add(this.normalMesh);
                    if(gltf.animations.length>0) {
                        this.nmMixer = new THREE.AnimationMixer(this.normalMesh);
                        this.nmMixer.clipAction(gltf.animations[0]).play();
                    }
                }, undefined, (e) => console.log("Load err:", normalFile));

                loader.load(mutantFile, (gltf) => {
                    this.mutantMesh = gltf.scene;
                    this.mutantMesh.scale.set(0.1,0.1,0.1); 
                    this.mutantMesh.visible = false;
                    this.modelGroup.add(this.mutantMesh);
                    if(gltf.animations.length>0) {
                        this.mmMixer = new THREE.AnimationMixer(this.mutantMesh);
                        this.mmMixer.clipAction(gltf.animations[0]).play();
                    }
                }, undefined, (e) => console.log("Load err:", mutantFile));
            }

            update(delta) {
                const time = Date.now() * 0.001;

                this.boids.forEach((boid, i) => {
                    if (this.state === 'focused') {
                        boid.visible = false;
                    } else {
                        boid.visible = true;
                        boid.position.x = this.center.x + boid.userData.offset.x + Math.sin(time + boid.userData.phase) * 5;
                        boid.position.z = this.center.z + boid.userData.offset.z + Math.cos(time + boid.userData.phase * 0.5) * 5;
                        const y = getElevation(boid.position.x, boid.position.z);
                        boid.position.y = y + 5 + Math.sin(time * 2 + i) * 2;
                        boid.rotation.y += 0.02;
                    }
                });

                const centerY = getElevation(this.center.x, this.center.z);
                this.modelGroup.position.set(this.center.x, centerY + 5, this.center.z);

                // 🌟 聚焦时：强制旋转 (Group 整体旋转)
                if (this.state === 'focused') {
                    this.modelGroup.rotation.y += 0.01; // 强制自转
                    this.modelGroup.position.y = centerY + 12 + Math.sin(time * 1.5) * 1.5; 
                }

                if(this.nmMixer) this.nmMixer.update(delta);
                if(this.mmMixer) this.mmMixer.update(delta);
            }

            hover(isHovering) {
                if (this.state === 'focused') return;
                if (isHovering && this.state !== 'hover') {
                    this.state = 'hover';
                    this.modelGroup.visible = true;
                    gsap.to(this.modelGroup.scale, {x:1, y:1, z:1, duration:0.5});
                    this.boids.forEach(b => gsap.to(b.scale, {x:0, y:0, z:0, duration:0.3}));
                } 
                else if (!isHovering && this.state === 'hover') {
                    this.state = 'swarm';
                    this.modelGroup.visible = false;
                    this.boids.forEach(b => gsap.to(b.scale, {x:1, y:1, z:1, duration:0.5, delay:0.2}));
                }
            }

            focus() {
                if (this.state === 'focused') return;
                this.state = 'focused';
                this.modelGroup.visible = true;
                const tl = gsap.timeline();
                if(this.normalMesh) {
                    tl.to(this.normalMesh.position, {x:0.5, duration:0.05, yoyo:true, repeat:5})
                      .to(this.normalMesh.scale, {x:0.1, y:0.1, z:0.1, duration:0.2});
                }
                tl.add(() => {
                    if(this.normalMesh) this.normalMesh.visible = false;
                    if(this.mutantMesh) this.mutantMesh.visible = true;
                });
                if(this.mutantMesh) {
                    // 🌟 30倍巨大化
                    tl.fromTo(this.mutantMesh.scale, 
                        {x:0.1, y:0.1, z:0.1}, 
                        {x:30, y:30, z:30, duration:0.8, ease:"back.out(1.2)"}
                    );
                }
            }

            unfocus() {
                if (this.state !== 'focused') return;
                this.state = 'swarm';
                const tl = gsap.timeline();
                if(this.mutantMesh) tl.to(this.mutantMesh.scale, {x:0.1, y:0.1, z:0.1, duration:0.3});
                tl.add(() => {
                    if(this.mutantMesh) this.mutantMesh.visible = false;
                    if(this.normalMesh) {
                        this.normalMesh.visible = true;
                        this.normalMesh.scale.set(5,5,5);
                    }
                    this.modelGroup.visible = false;
                });
                this.boids.forEach(b => {
                    b.visible = true;
                    gsap.to(b.scale, {x:1, y:1, z:1, duration:0.5});
                });
            }
        }

        const swarms = [
            new SpeciesSwarm("POLYMER TURTLE", "./wugui.glb", "./bwugui.glb", new THREE.Vector3(0, 0, 0)),
            new SpeciesSwarm("PLASTIC CRAB", "./xie.glb", "./bxie.glb", new THREE.Vector3(30, 0, 30)),
            new SpeciesSwarm("OIL BIRD", "./niao.glb", "./bniao.glb", new THREE.Vector3(-40, 0, -40)),
            new SpeciesSwarm("FIBER JELLY", "./shuimu.glb", "./bshuimu.glb", new THREE.Vector3(0, 0, -60)),
            new SpeciesSwarm("SONAR DOLPHIN", "./haitun.glb", "./bhaitun.glb", new THREE.Vector3(-50, 0, 20)),
            new SpeciesSwarm("TOXIC SNAKE", "./she.glb", "./bshe.glb", new THREE.Vector3(50, 0, 50)),
            new SpeciesSwarm("ACID FROG", "./wa.glb", "./bwa.glb", new THREE.Vector3(-60, 0, 0)),
            new SpeciesSwarm("RADIOACTIVE FISH", "./yu.glb", "./byu.glb", new THREE.Vector3(60, 0, -20)),
            new SpeciesSwarm("GHOST SEAL", "./bao.glb", "./bhaibao.glb", new THREE.Vector3(20, 0, -80))
        ];

        // --- 6. 交互逻辑 ---
        const clock = new THREE.Clock();
        const uiLayer = document.getElementById('ui-layer');
        const videoEl = document.getElementById('ui-video');
        let focusedSwarm = null; 
        
        window.closePanel = function() {
            if (focusedSwarm) {
                focusedSwarm.unfocus();
                focusedSwarm = null;
                
                videoEl.pause();
                videoEl.currentTime = 0;

                // 镜头复原
                gsap.to(camera.position, {x: 0, y: 60, z: 80, duration: 1.5, ease: "power2.inOut"});
                gsap.to(controls.target, {x: 0, y: 0, z: 0, duration: 1.5});
                
                uiLayer.classList.remove('active');
                document.getElementById('ui-header').style.opacity = 1;
                
                droneGroup.visible = false;
                document.body.style.cursor = 'none'; 
            }
        };

        document.addEventListener('mousemove', (e) => {
            if (!focusedSwarm) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(hitPlane);
                if (intersects.length > 0) {
                    mouseWorld.copy(intersects[0].point);
                    shaderMaterial.uniforms.uMouse.value.copy(intersects[0].point);
                }
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.closest('.close-btn') || e.target.closest('.right-panel') || e.target.closest('.left-panel')) return;

            let clickedSwarm = null;
            swarms.forEach(swarm => {
                const dist = new THREE.Vector2(swarm.center.x, swarm.center.z).distanceTo(new THREE.Vector2(mouseWorld.x, mouseWorld.z));
                if (dist < 15) clickedSwarm = swarm;
            });

            if (clickedSwarm) {
                if (focusedSwarm !== clickedSwarm) {
                    if(focusedSwarm) focusedSwarm.unfocus();
                    focusedSwarm = clickedSwarm;
                    focusedSwarm.focus();

                    // 镜头推进：🌟 往后拉得更远 (+50/80)，容纳 30 倍模型
                    const targetPos = focusedSwarm.modelGroup.position;
                    gsap.to(camera.position, {
                        x: targetPos.x + 50, 
                        y: targetPos.y + 30, 
                        z: targetPos.z + 80, 
                        duration: 1.5, 
                        ease: "power2.inOut"
                    });
                    gsap.to(controls.target, {x: targetPos.x, y: targetPos.y, z: targetPos.z, duration: 1.5});

                    // UI 更新
                    const data = animalData[focusedSwarm.name] || {};
                    document.getElementById('ui-name').innerText = data.name || focusedSwarm.name;
                    document.getElementById('ui-latin').innerText = data.latin || "Unknown";
                    document.getElementById('ui-source').innerText = data.source || "Unknown";
                    document.getElementById('ui-tox').innerText = data.tox || "0%";
                    document.getElementById('ui-desc').innerText = `"${data.desc || '...'}"`;
                    document.getElementById('ui-look').innerText = data.look || "...";
                    document.getElementById('ui-act').innerText = data.act || "...";

                    // 视频播放
                    if (data.video) {
                        videoEl.src = data.video;
                        setTimeout(() => { videoEl.play().catch(e=>console.log(e)); }, 500);
                    }

                    uiLayer.classList.add('active');
                    document.getElementById('ui-header').style.opacity = 0;
                    document.body.style.cursor = 'auto'; 

                    droneGroup.visible = true;
                }
            } else {
                if (focusedSwarm) window.closePanel();
            }
        });

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = Date.now() * 0.001;

            if (focusedSwarm) {
                cursorGroup.scale.set(0,0,0);
                
                const targetPos = focusedSwarm.modelGroup.position;
                droneGroup.position.x = targetPos.x + Math.sin(time) * 35; // 35半径
                droneGroup.position.z = targetPos.z + Math.cos(time) * 35;
                droneGroup.position.y = targetPos.y + 25 + Math.sin(time*2)*2;
                droneGroup.lookAt(targetPos);
                
                recLight.material.color.setHex((Date.now() % 1000 < 500) ? 0xff0000 : 0x330000);

            } else {
                cursorGroup.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
                let hoverSwarm = null;
                swarms.forEach(swarm => {
                    const dist = new THREE.Vector2(swarm.center.x, swarm.center.z).distanceTo(new THREE.Vector2(mouseWorld.x, mouseWorld.z));
                    if (dist < 20) hoverSwarm = swarm;
                    swarm.hover(dist < 20);
                    swarm.update(delta);
                });

                if (hoverSwarm) {
                    hexMaterial.color.set(0xff4444);
                    cursorGroup.scale.lerp(new THREE.Vector3(1.5, 1.5, 1.5), 0.1);
                } else {
                    hexMaterial.color.set(0x333333);
                }

                const targetY = getElevation(mouseWorld.x, mouseWorld.z);
                cursorGroup.position.x += (mouseWorld.x - cursorGroup.position.x) * 0.2;
                cursorGroup.position.z += (mouseWorld.z - cursorGroup.position.z) * 0.2;
                cursorGroup.position.y += (targetY - cursorGroup.position.y) * 0.2;
                cursorHex.rotation.z += 0.01;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        
        setTimeout(() => { document.getElementById('loading').style.opacity = 0; }, 2000);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
